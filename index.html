<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>It's Saturday — Mobile Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet" />
  <!-- 英文字體：Adobe Fonts「collier」（按鈕用） -->
  <link rel="stylesheet" href="https://use.typekit.net/ezg8jxr.css" />
  <style>
    /* ══════════ 設定（改這裡就好） ══════════ */
    :root {
      --btn-font: "collier", 'Noto Sans TC', sans-serif;  /* 按鈕：英文 collier、中文思源黑體 */
      --btn-bottom: 12%;                /* 按鈕距離底部的位置 */
      --shade: rgba(0, 0, 0, .35);      /* 底部漸層陰影，不要就改 transparent */
      --btn-text: #ffffff;              /* 按鈕文字 */
      --btn-line: #ffffff;              /* 按鈕框線 */
      --btn-hover-bg: #ffffff;          /* 按鈕點擊時：底色 */
      --btn-hover-text: #33230f;        /* 按鈕點擊時：文字 */
      --placeholder: #8c7053;           /* 圖片載入前的佔位色 */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--placeholder);
      overflow: hidden;
    }

    .banner {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--placeholder);
    }

    .banner img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      color: transparent;
    }

    .shade {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(to bottom, transparent, var(--shade));
      pointer-events: none;
    }

    .btn {
      position: absolute;
      left: 50%;
      bottom: var(--btn-bottom);
      transform: translateX(-50%);
      min-width: 220px;
      padding: 16px 32px;
      border: 1px solid var(--btn-line);
      background: transparent;
      color: var(--btn-text);
      font-family: var(--btn-font);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color .25s ease, color .25s ease;
    }

    .btn:hover,
    .btn:focus {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
    }
  </style>
</head>
<body>
  <div class="banner">
    <!-- 底圖 → 換成你的圖片網址 -->
    <img src="https://ik.imagekit.io/itssaturday/banner/20261003-banner-m-2.jpg" alt="台灣水泥香氛蠟燭" />
    <div class="shade"></div>
    <!-- 按鈕 → 換成你的文字與連結；target="_top" 讓點擊後整頁跳轉，不會只在框框裡開 -->
    <a class="btn" href="https://its-saturday.com/item/class-202610-flower" target="_top">Best Sellers</a>
  </div>
</body>
</html>
